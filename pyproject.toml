[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtk-hermes"
version = "1.3.0"
description = "Fail-open Hermes adapter for RTK command rewriting and optional output compression"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "ether-btc"}]
keywords = ["rtk", "hermes", "hermes-agent", "llm", "token-savings", "cli-proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ether-btc/rtk-hermes"
Repository = "https://github.com/ether-btc/rtk-hermes"
Issues = "https://github.com/ether-btc/rtk-hermes/issues"
RTK = "https://github.com/rtk-ai/rtk"
Hermes = "https://github.com/NousResearch/hermes-agent"

[project.entry-points."hermes_agent.plugins"]
rtk-rewrite = "rtk_hermes:register"

[tool.setuptools.packages.find]
where = ["src"]
